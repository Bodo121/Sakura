name: Rust CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable && rustup component add clippy rustfmt
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libudev-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --locked -p sakura -p sakurad
      - run: python3 scripts/integration.py
      - run: cargo metadata --locked --format-version 1 > /dev/null
      - run: cargo install cargo-audit --locked && cargo audit
      - uses: actions/upload-artifact@v4
        with:
          name: host-benchmarks
          path: dist/host-benchmarks.json
