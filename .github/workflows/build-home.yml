name: Sakura Home Flutter Material 3
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: sakura-home-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  launcher:
    if: github.head_ref != 'dev/gsi-0.2.0' && github.ref_name != 'dev/gsi-0.2.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-34' 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - run: rustup update stable && rustup default stable && rustup component add clippy rustfmt
      - run: cargo fmt --all -- --check && cargo clippy -p sakura-home --all-targets --locked -- -D warnings && cargo test -p sakura-home --locked
      - name: Restore optional protected development signing identity
        env:
          SAKURA_DEBUG_KEYSTORE: ${{ secrets.SAKURA_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .local
          if [ -n "$SAKURA_DEBUG_KEYSTORE" ]; then
            printf '%s' "$SAKURA_DEBUG_KEYSTORE" | base64 --decode > .local/sakura-debug.jks
            chmod 600 .local/sakura-debug.jks
          fi
      - run: bash scripts/build-home.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SakuraHome-v0.2.0
          path: |
            dist/home/**
            platform/flutter-home/pubspec.lock
