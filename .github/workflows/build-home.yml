name: Sakura Home Kotlin and Rust
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  launcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-34' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'emulator' 'system-images;android-34;google_apis;x86_64'
      - run: rustup update stable && rustup default stable && rustup component add clippy rustfmt
      - run: cargo fmt --all -- --check && cargo clippy -p sakura-home --all-targets --locked -- -D warnings && cargo test -p sakura-home --locked
      - name: Restore optional protected development signing identity
        env:
          SAKURA_DEBUG_KEYSTORE: ${{ secrets.SAKURA_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .local
          if [ -n "$SAKURA_DEBUG_KEYSTORE" ]; then
            printf '%s' "$SAKURA_DEBUG_KEYSTORE" | base64 --decode > .local/sakura-debug.jks
            chmod 600 .local/sakura-debug.jks
          fi
      - run: bash scripts/build-home.sh
      - name: Launch and test on Android 14
        run: bash scripts/test-home-emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SakuraHome-v0.1.1
          path: |
            dist/home/*.apk
            dist/home/SHA256SUMS.txt
            dist/home/runtime-tests/**
