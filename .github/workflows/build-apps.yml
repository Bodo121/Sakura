name: Native Rust applications
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  applications:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;27.2.12479018'
      - run: rustup update stable && rustup default stable && rustup target add aarch64-linux-android
      - run: mkdir -p .local
      - name: Restore optional protected development signing identity
        env:
          SAKURA_DEBUG_KEYSTORE: ${{ secrets.SAKURA_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SAKURA_DEBUG_KEYSTORE" ]; then
            printf '%s' "$SAKURA_DEBUG_KEYSTORE" | base64 --decode > .local/sakura-debug.jks
            chmod 600 .local/sakura-debug.jks
          fi
      - run: bash scripts/build-apps.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SakuraOS-Apps-v0.1.0
          path: |
            dist/apps/*.apk
            dist/SakuraOS-Apps-v0.1.0.zip
