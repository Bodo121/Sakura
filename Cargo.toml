[workspace]
resolver = "2"
members = ["crates/*", "daemon", "cli", "apps/*"]
default-members = ["daemon", "cli"]
[workspace.package]
version = "0.1.0"
edition = "2021"
[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = "2"
semver = "1"
tempfile = "3"
slint = { version = "=1.19.0", default-features = false, features = ["std", "compat-1-2", "renderer-software"] }
[profile.release]
lto = "thin"
strip = true
codegen-units = 1
